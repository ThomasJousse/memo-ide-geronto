name: Correction de contenu
description: Signaler une erreur, une imprécision ou une information à mettre à jour dans une fiche, une échelle ou un calculateur.
title: "[Correction] "
labels: ["contenu", "correction"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ne mettez **aucune donnée de patient** dans ce formulaire.
  - type: input
    id: fiche
    attributes:
      label: Fiche concernée
      description: Titre ou identifiant (affiché dans le lien « Signaler une erreur » de la fiche).
      placeholder: "ex. m-paracetamol, confusion-aigue, scale-braden"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
      description: Phrase ou valeur concernée, et pourquoi elle est fausse ou incomplète.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Ce qu'il faudrait écrire
  - type: input
    id: source
    attributes:
      label: Source
      description: Recommandation, protocole, RCP, référence de l'établissement…
  - type: dropdown
    id: gravite
    attributes:
      label: Gravité
      options:
        - "Erreur pouvant entraîner un risque pour un patient"
        - "Information inexacte ou obsolète"
        - "Amélioration, précision, faute de frappe"
    validations:
      required: true
