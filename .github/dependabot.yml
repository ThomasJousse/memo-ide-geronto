version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
      tooling:
        patterns: ["vite", "marked", "js-yaml", "@capacitor/assets"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
