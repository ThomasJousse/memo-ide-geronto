name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Version depuis le tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Dépendances
        run: npm ci

      - name: Vérifier le contenu
        run: npm run check

      - name: Build web
        run: npm run build
        env:
          APP_VERSION: ${{ steps.v.outputs.name }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gradle assembleRelease (signé)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ steps.v.outputs.name }} \
            -PappVersionCode=${{ steps.v.outputs.code }}

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "memo-ide-geronto-${GITHUB_REF_NAME}.apk"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mémo IDE Géronto ${{ github.ref_name }}
          files: memo-ide-geronto-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            Installation : télécharger le fichier `.apk` ci-dessous sur le téléphone Android, l'ouvrir, autoriser l'installation depuis cette source si demandé. Une version déjà installée est mise à jour sans perdre les favoris.
