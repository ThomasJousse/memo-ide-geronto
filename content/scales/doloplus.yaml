id: doloplus
title: "Doloplus-2 — douleur chronique chez la personne âgée non communicante"
short: "Doloplus"
type: sum
order: 51
tags: "Doloplus, douleur chronique, hétéro-évaluation, démence, non communicant, retentissement somatique, psychomoteur, psychosocial"
resume: "10 items cotés de 0 à 3, en équipe, en comparant au comportement habituel. Score ≥ 5/30 = douleur."
