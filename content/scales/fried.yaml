id: fried
title: "Phénotype de fragilité de Fried"
short: "Fried"
type: sum
order: 40
tags: "fragilité, Fried, phénotype, vitesse de marche, force de préhension, épuisement, perte de poids, sédentarité"
resume: "5 critères. 0 = robuste, 1 à 2 = pré-fragile, 3 et plus = fragile."
sources: "Fried LP et al., J Gerontol 2001 ; HAS 2013 Repérage de la fragilité"
intro: "Cocher chaque critère présent."
items:
  - { id: poids, label: "Perte de poids involontaire ≥ 4,5 kg (ou ≥ 5 %) en un an" }
