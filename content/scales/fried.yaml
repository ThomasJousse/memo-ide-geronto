  - { id: activite, label: "Activité physique faible", help: "Sédentarité, ne marche presque plus, pas d'activité de loisir physique." }
  - { id: marche, label: "Vitesse de marche lente", help: "Plus de 5 secondes pour parcourir 4 mètres (< 0,8 m/s)." }
  - { id: force, label: "Force de préhension diminuée", help: "Dynamomètre : < 27 kg chez l'homme, < 16 kg chez la femme (seuils EWGSOP2)." }
ranges:
  - { min: 0, max: 0, text: "Robuste.", level: ok }
  - { min: 1, max: 2, text: "Pré-fragile : agir sur l'activité physique, la nutrition, les médicaments.", level: warn, link: fragilite }
  - { min: 3, max: 5, text: "Fragile : évaluation gériatrique standardisée et plan personnalisé de prévention.", level: crit, link: fragilite }
