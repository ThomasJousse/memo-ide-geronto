id: eat-10
title: "EAT-10 — auto-questionnaire de déglutition"
short: "EAT-10"
type: sum
order: 92
tags: "EAT-10, déglutition, dysphagie, fausse route, auto-questionnaire, repérage"
resume: "10 affirmations cotées de 0 (aucun problème) à 4 (problème sévère). Score ≥ 3 = trouble de déglutition probable : évaluation orthophonique."
sources: "Belafsky PC et al., Ann Otol Rhinol Laryngol 2008 ; version française validée (Lechien JR et al., 2019)"
intro: "Le patient indique dans quelle mesure chaque affirmation correspond à son problème."
options:
  - { label: "0 — Aucun problème", points: 0 }
  - { label: "1", points: 1 }
  - { label: "2", points: 2 }
  - { label: "3", points: 3 }
  - { label: "4 — Problème sévère", points: 4 }
items:
  - { id: q1, label: "Mon problème de déglutition m'a fait perdre du poids" }
  - { id: q2, label: "Mon problème de déglutition m'empêche de manger au restaurant" }
  - { id: q3, label: "Avaler des liquides me demande un effort supplémentaire" }
  - { id: q4, label: "Avaler des aliments solides me demande un effort supplémentaire" }
  - { id: q5, label: "Avaler des comprimés me demande un effort supplémentaire" }
  - { id: q6, label: "Avaler est douloureux" }
  - { id: q7, label: "Le plaisir de manger est affecté par mon problème de déglutition" }
  - { id: q8, label: "Quand j'avale, des aliments restent coincés dans ma gorge" }
