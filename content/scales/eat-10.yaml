  - { id: q10, label: "Avaler est stressant" }
ranges:
  - { min: 0, max: 2, text: "Pas de trouble de déglutition rapporté (n'exclut pas une dysphagie silencieuse, fréquente en cas de troubles cognitifs).", level: ok }
  - { min: 3, max: 40, text: "Trouble de déglutition probable : adapter les textures, évaluation orthophonique.", level: warn, link: dysphagie }
